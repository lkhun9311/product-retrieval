[project]
name = "product-retrieval"
version = "0.1.0"
description = "Connect a photographed product to the same or a similar product in a gallery, improving via user feedback."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "typer",
    "pyyaml",
    "pillow",
    "numpy",
    "transformers",
    "faiss-cpu",
    "torch",
    "scikit-learn>=1.9.1",
]

[project.scripts]
pr = "product_retrieval.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_retrieval"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# `slow` tests download a real model from Hugging Face; keep them out of the
# default run and invoke explicitly with `pytest -m slow`.
addopts = '-m "not slow"'
markers = [
    "slow: slow test that downloads a real model (deselected by default)",
]

# CPU-only torch wheel for this dev machine. The GPU training node will instead
# point `torch` at a CUDA wheel index (e.g. https://download.pytorch.org/whl/cu121)
# by overriding [tool.uv.sources] torch there -- this is not meant to be shared.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
